[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-deal-scanner-agent"
version = "1.0.0"
description = "Multi-agent Google ADK airfare scanner monitoring SNA & LAX to Japan, London, Vancouver, Toronto, Spain, and Italy every 2 hours for 30%/40%/50%+ price drops ~45 days out (7+ day stays)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "google-adk[db]>=1.2.0",
    "google-genai>=1.10.0",
    "google-cloud-aiplatform[agent_engines,evaluation]>=1.88.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-secret-manager>=2.22.0",
    "google-cloud-dlp>=3.25.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "python-json-logger>=3.1.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["flight_scanner_agent*", "deployment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
